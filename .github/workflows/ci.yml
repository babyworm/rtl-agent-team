name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r tests/requirements-test.txt
      - run: python -m pytest tests/unit/ -x -q
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck -s sh hooks/*.sh
      - run: shellcheck -s sh hooks/lib/*.sh

  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify template revisions
        run: |
          python3 scripts/template_catalog.py

      - name: Validate JSON manifests parse cleanly
        run: |
          for f in package.json .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json; do
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Verify version sync across manifests
        run: |
          PKG=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          PLUGIN=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          MARKET_META=$(python3 -c 'import json; print(json.load(open(".claude-plugin/marketplace.json"))["metadata"]["version"])')
          MARKET_PLUGIN=$(python3 -c 'import json; print(json.load(open(".claude-plugin/marketplace.json"))["plugins"][0]["version"])')
          for v in "$PLUGIN" "$MARKET_META" "$MARKET_PLUGIN"; do
            if [ "$PKG" != "$v" ]; then
              echo "Version drift: package.json=$PKG, plugin.json=$PLUGIN, marketplace.metadata=$MARKET_META, marketplace.plugins[0]=$MARKET_PLUGIN"
              exit 1
            fi
          done
          echo "All versions aligned at $PKG"

      - name: Verify SessionStart hook output schema
        # Locks the contract that broke in v0.10.1/v0.10.2: hook stdout
        # MUST be valid JSON with hookSpecificOutput.hookEventName, in BOTH
        # the marker-absent and marker-present branches.
        run: |
          set -e
          # Marker-absent path -> minimal envelope, no additionalContext.
          mkdir -p /tmp/clean-no-marker
          OUT=$(echo '{"cwd":"/tmp/clean-no-marker"}' | sh hooks/rtl-orchestrator-inject.sh)
          printf '%s' "$OUT" | python3 -m json.tool > /dev/null
          python3 - "$OUT" <<'PY'
          import json, sys
          d = json.loads(sys.argv[1])
          hso = d.get("hookSpecificOutput", {})
          assert hso.get("hookEventName") == "SessionStart", f"missing/wrong hookEventName: {hso}"
          assert "additionalContext" not in hso, f"unexpected context in marker-absent path: {hso}"
          PY

          # Marker-present path -> envelope with non-empty additionalContext.
          mkdir -p /tmp/rat-marker/.rat
          OUT=$(echo '{"cwd":"/tmp/rat-marker"}' | sh hooks/rtl-orchestrator-inject.sh)
          printf '%s' "$OUT" | python3 -m json.tool > /dev/null
          python3 - "$OUT" <<'PY'
          import json, sys
          d = json.loads(sys.argv[1])
          hso = d.get("hookSpecificOutput", {})
          assert hso.get("hookEventName") == "SessionStart", f"missing/wrong hookEventName: {hso}"
          ctx = hso.get("additionalContext", "")
          assert "Pipeline Rules" in ctx, "routing markdown missing"
          assert "/rtl-agent-team:rat-auto-design" in ctx, "skill route missing"
          print(f"marker-present envelope OK ({len(ctx)} chars of additionalContext)")
          PY

      - name: Verify generated files and prepare a patch for drift
        id: generated-files
        run: |
          python3 scripts/sync_agent_policies.py
          bash scripts/generate-phase-maps.sh --write
          sh scripts/sync_orchestrator_inject.sh
          git diff --no-ext-diff -- agents/ hooks/ > "$RUNNER_TEMP/generated-files.patch"
          if [ -s "$RUNNER_TEMP/generated-files.patch" ]; then
            echo '::error::Generated files differ from their sources. See the generated-files-patch artifact.'
            exit 1
          fi
      - name: Keep the generated-files patch
        if: ${{ failure() && steps.generated-files.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: generated-files-patch
          path: ${{ runner.temp }}/generated-files.patch
          if-no-files-found: ignore

  runtime-contracts:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Exercise simulation verdicts with generated logs
        run: |
          python -m pip install pytest
          RAT_EXTENDED_CONTRACTS=1 python -m pytest tests/unit/test_verdict_properties.py
      - name: Run shipped testbench templates with Verilator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y verilator
          verilator --version
          ulimit -c 0
          python evals/runtime/check_verilator_templates.py --workdir "$RUNNER_TEMP/rat-template-contracts"
      - name: Keep results and logs from the synthetic simulation
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: template-contract-results
          path: |
            ${{ runner.temp }}/rat-template-contracts/results.json
            ${{ runner.temp }}/rat-template-contracts/unit/*.log
            ${{ runner.temp }}/rat-template-contracts/integration/*.log
